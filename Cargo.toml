[package]
name = "rackglass"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit"]
kms = ["slint/backend-linuxkms"]
femtovg = ["slint/renderer-femtovg"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
chrono = "0.4"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
tiny-skia = "0.12"
zune-jpeg = "0.5"
zune-core = "0.5"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
png = "0.18"

[profile.release]
lto = "thin"
